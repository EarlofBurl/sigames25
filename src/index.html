<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI-Games Runden-Taktik</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="top-bar" style="display: none;">
        <button id="options-button">Optionen</button>
        <button id="save-button">Speichern</button>
        <button id="reset-button">Zurücksetzen</button>
        <button id="restart-mission-button">Mission neu starten</button>
        <button id="end-turn-button">Zug beenden</button>
        <div id="turn-counter" style="margin-left: auto; margin-right: 10px;">Runde: <span id="turn-number">1</span></div>
    </div>
    <div id="main-area">
        <div id="info-panel" style="display: none;">
            <div id="unit-details">
                <h3 id="unit-title">Einheiten-Details</h3>
                <div id="unit-portrait"></div>
                <div id="unit-stats">
                    <p>Typ: <span id="unit-type">Nahkampf</span></p>
                    <p>HP: <span id="unit-hp">10</span>/<span id="unit-max-hp">10</span></p>
                    <p>MP: <span id="unit-mp">5</span>/<span id="unit-max-mp">5</span></p>
                    <p>Angriff: <span id="unit-attack">3</span></p>
                    <p>Verteidigung: <span id="unit-defense">2</span></p>
                </div>
                <div id="unit-spells"></div>
                <div id="unit-commands">
                    <button class="command-button" id="deselect-button">Einheit abwählen</button>
                    <button class="command-button" id="wait-button">Warten</button>
                </div>
            </div>
            <div id="terrain-info">
                <h3>Terrain-Infos</h3>
                <div id="terrain-image"></div>
                <div id="terrain-stats">
                    <p id="terrain-info-text">Klicke auf ein Feld, um Terrain-Infos anzuzeigen.</p>
                </div>
            </div>
        </div>
        <div id="game-area">
            <div id="app">
                <p>Falls dieser Text sichtbar ist, wird das JavaScript nicht korrekt geladen.</p>
            </div>
        </div>
    </div>
    <div id="action-console" style="display: none;">
        <h3>Aktions-Log</h3>
        <div id="console-output"></div>
    </div>
    <div id="dialog-overlay" style="display: none;">
        <div id="dialog-box">
            <div id="left-portrait"></div>
            <div id="dialog-text"></div>
            <div id="right-portrait"></div>
        </div>
        <div id="dialog-hint">Klicken zum Fortfahren</div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
