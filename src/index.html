<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI-Games Runden-Taktik</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="top-bar" style="display: none;">
        <button id="options-button">Optionen</button>
        <button id="save-button">Speichern</button>
        <button id="reset-button">Zurücksetzen</button>
    </div>
    <div id="main-area">
        <div id="info-panel" style="display: none;">
            <div id="unit-details">
                <h3>Einheiten-Details</h3>
                <div id="unit-portrait"></div>
                <p id="unit-info">Wähle eine Einheit aus, um Details anzuzeigen.</p>
                <div id="unit-commands">
                    <button class="command-button">Angreifen</button>
                    <button class="command-button">Verteidigen</button>
                    <button class="command-button">Warten</button>
                </div>
            </div>
            <div id="terrain-info">
                <h3>Terrain-Infos</h3>
                <div id="terrain-image"></div>
                <p id="terrain-info-text">Klicke auf ein Feld, um Terrain-Infos anzuzeigen.</p>
            </div>
        </div>
        <div id="game-area">
            <div id="app">
                <p>Falls dieser Text sichtbar ist, wird das JavaScript nicht korrekt geladen.</p>
            </div>
        </div>
    </div>
    <div id="action-console" style="display: none;">
        <h3>Aktions-Log</h3>
        <div id="console-output"></div>
    </div>
    <div id="dialog-overlay" style="display: none;">
        <div id="dialog-box">
            <div id="left-portrait"></div>
            <div id="dialog-text"></div>
            <div id="right-portrait"></div>
        </div>
        <div id="dialog-hint">Klicken zum Fortfahren</div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
